<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Officina</title>
<meta name="theme-color" content="#F3F5F4">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Officina">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;500;600;700&display=swap">
<style>
:root {
  /* Plan : application à une colonne pour téléphone, barre d'onglets en bas, cartes à zones fixes.
     Les couleurs vives sont réservées à la gravité ; tout le reste est en vert officine et gris-vert. */
  --paper: #F3F6F4;
  --surface: #FFFFFF;
  --ink: #14302A;
  --ink-2: #48605A;
  --ink-3: #7B908A;
  --line: #D9E3DF;
  --accent: #0B7A63;
  --accent-soft: #DCEFE9;
  --g-ci: #BF3327; --g-ci-bg: #FBE8E5;
  --g-asdec: #C95F0E; --g-asdec-bg: #FDEDDB;
  --g-pe: #8A6A00; --g-pe-bg: #FAF1C8; --g-pe-mark: #D9A800;
  --g-apec: #2463AC; --g-apec-bg: #E2EDFA;
  --g-poso: #6A40A8; --g-poso-bg: #EEE6F9;
  --ok: #0B7A63; --ok-bg: #DCEFE9;
  --font-display: "Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif;
  --font-body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--paper); color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.5; -webkit-text-size-adjust: 100%; }
#app { height: 100%; display: flex; flex-direction: column; max-width: 560px; margin: 0 auto; background: var(--paper); }
main { flex: 1; overflow-y: auto; padding: 18px 16px 28px; display: flex; flex-direction: column; gap: 16px; -webkit-overflow-scrolling: touch; }
h1, h2, h3 { font-family: var(--font-display); margin: 0; text-wrap: balance; line-height: 1.2; }
h1 { font-size: 26px; font-weight: 700; letter-spacing: -0.01em; }
h2 { font-size: 19px; font-weight: 600; }
h3 { font-size: 13px; font-weight: 600; font-family: var(--font-body); color: var(--ink-3); letter-spacing: 0.02em; }
p { margin: 0; }
a { color: var(--accent); }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.muted { color: var(--ink-2); font-size: 14px; }
.small { font-size: 13px; color: var(--ink-3); }
.stack { display: flex; flex-direction: column; gap: 10px; }
.row { display: flex; align-items: center; gap: 10px; }
.wrap { display: flex; flex-wrap: wrap; gap: 6px; }
.grow { flex: 1; min-width: 0; }

/* Barre d'onglets */
nav.tabs { display: flex; background: var(--surface); border-top: 1px solid var(--line); padding: 6px 4px 8px; }
nav.tabs button { flex: 1; min-width: 0; background: none; border: 0; padding: 6px 0; display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 10px; letter-spacing: -0.01em; color: var(--ink-3); border-radius: 10px; min-height: 48px; }
nav.tabs button svg { width: 22px; height: 22px; }
nav.tabs button[aria-current="page"] { color: var(--accent); font-weight: 600; }

/* Cartes */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px; }
.card.tap { width: 100%; text-align: left; display: flex; align-items: center; gap: 12px; }
.card.tap:active { background: var(--accent-soft); }
.hero { background: var(--accent); color: #fff; border-radius: 18px; padding: 16px; display: flex; align-items: center; gap: 16px; }
.hero h2 { color: #fff; }
.hero p { color: #D5EEE7; font-size: 14px; }
.hero .btn { background: #fff; color: var(--accent); border-color: #fff; margin-top: 10px; }
.tile { width: 40px; height: 40px; border-radius: 11px; background: var(--accent-soft); color: var(--accent); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.tile svg { width: 22px; height: 22px; }
.done .titre { text-decoration: line-through; color: var(--ink-3); }

.btn { background: var(--surface); border: 1px solid var(--ink-3); border-radius: 11px; padding: 10px 16px; font-weight: 600; font-size: 15px; min-height: 44px; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.block { width: 100%; }
.btn.ghost { border-color: var(--line); font-weight: 500; }
.back { background: none; border: 0; padding: 6px 8px 6px 0; color: var(--ink-2); font-size: 14px; display: inline-flex; align-items: center; gap: 4px; min-height: 40px; }

.chip { font-size: 12.5px; padding: 3px 10px; border-radius: 999px; border: 1px solid var(--line); color: var(--ink-2); background: var(--surface); display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
button.chip { min-height: 34px; padding: 5px 12px; font-size: 13.5px; }
button.chip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: #fff; }
.statut { font-size: 12px; padding: 2px 8px; border-radius: 6px; font-weight: 600; }
.statut.verifie { background: var(--ok-bg); color: var(--ok); }
.statut.partiel, .statut.a_verifier { background: #ECEFEE; color: var(--ink-2); border: 1px dashed var(--ink-3); }

/* Gravité : couleur + forme */
.grav { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; padding: 3px 10px 3px 7px; border-radius: 8px; }
.grav svg { width: 15px; height: 15px; flex-shrink: 0; }
.grav.ci { background: var(--g-ci-bg); color: var(--g-ci); }
.grav.asdec { background: var(--g-asdec-bg); color: var(--g-asdec); }
.grav.pe { background: var(--g-pe-bg); color: var(--g-pe); }
.grav.apec { background: var(--g-apec-bg); color: var(--g-apec); }
.grav.poso { background: var(--g-poso-bg); color: var(--g-poso); }
button.grav { border: 1.5px solid transparent; min-height: 36px; }
button.grav[aria-pressed="true"] { border-color: currentColor; box-shadow: inset 0 0 0 1px currentColor; }
.bord-ci { border-left: 5px solid var(--g-ci); } .bord-asdec { border-left: 5px solid var(--g-asdec); }
.bord-pe { border-left: 5px solid var(--g-pe-mark); } .bord-apec { border-left: 5px solid var(--g-apec); }
.bord-poso { border-left: 5px solid var(--g-poso); }

/* Ordonnance */
.ordonnance { background: var(--surface); border: 1px solid var(--line); border-radius: 4px 4px 14px 14px; border-top: 4px double var(--ink); padding: 4px 0 0; }
.ordonnance .origine { font-size: 12px; color: var(--ink-3); padding: 10px 14px 2px; font-weight: 600; letter-spacing: 0.03em; }
.ligne { width: 100%; text-align: left; background: none; border: 0; border-top: 1px solid var(--line); padding: 11px 14px; display: flex; gap: 10px; align-items: flex-start; }
.ligne:first-of-type { border-top: 0; }
.ligne .num { font-family: var(--font-display); font-weight: 600; color: var(--ink-3); width: 18px; font-variant-numeric: tabular-nums; }
.ligne .nom { font-weight: 600; }
.ligne.ouverte { background: #F7FAF9; }
.editeur { border-top: 1px dashed var(--ink-3); background: #F7FAF9; padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 10px; }
.editeur label, .champ label { font-size: 13px; font-weight: 600; color: var(--ink-2); }
textarea, input[type="search"], input[type="text"] { width: 100%; font: inherit; font-size: 16px; color: var(--ink); border: 1px solid var(--ink-3); border-radius: 10px; padding: 9px 11px; background: var(--surface); }
textarea { min-height: 76px; resize: vertical; }
.erreur { color: var(--g-ci); font-size: 13px; font-weight: 600; }

/* Chaîne de mécanisme */
.chaine { display: flex; flex-direction: column; gap: 0; }
.chaine div { position: relative; padding: 6px 10px 6px 26px; font-size: 14.5px; }
.chaine div::before { content: ""; position: absolute; left: 8px; top: 13px; width: 8px; height: 8px; border-radius: 50%; background: var(--ink); }
.chaine div:not(:last-child)::after { content: ""; position: absolute; left: 11px; top: 21px; bottom: -13px; width: 2px; background: var(--ink-3); }
.chaine div:last-child { font-weight: 600; }

/* Bloc de correction à zones fixes */
.corr { background: var(--surface); border: 1px solid var(--line); border-radius: 0 14px 14px 0; padding: 14px; display: flex; flex-direction: column; gap: 12px; }
.corr .zone > h3 { margin-bottom: 4px; }
.criteres { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }
.crit { border-radius: 8px; padding: 6px 4px; text-align: center; font-size: 12px; font-weight: 600; background: #ECEFEE; color: var(--ink-2); }
.crit.oui { background: var(--ok-bg); color: var(--ok); }
.auto { display: flex; gap: 6px; }
.auto button { flex: 1; border: 1px solid var(--line); background: var(--surface); border-radius: 9px; padding: 7px 4px; font-size: 13px; min-height: 40px; }
.auto button[aria-pressed="true"] { background: var(--ink); color: #fff; border-color: var(--ink); }
.citation { font-family: var(--font-display); font-size: 18px; line-height: 1.35; }
.note-moi { border-left: 3px solid var(--ink-3); padding: 2px 0 2px 10px; font-size: 14px; color: var(--ink-2); font-style: italic; }

/* Carte médicament : zones fixes */
.fiche { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 8px; }
.fiche .z { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 11px 12px; }
.fiche .z h3 { margin-bottom: 6px; display: flex; align-items: center; gap: 6px; }
.fiche .z ul { margin: 0; padding-left: 16px; font-size: 14px; display: flex; flex-direction: column; gap: 5px; }
.fiche .z.poso { border-top: 4px solid var(--accent); }
.fiche .z.alertes { border-top: 4px solid var(--g-ci); }
.fiche .z.conseils { grid-column: 1 / -1; border-top: 4px solid var(--ink); }
.rappel { border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }
.rappel summary { padding: 11px 12px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 8px; list-style: none; }
.rappel summary::-webkit-details-marker { display: none; }
.rappel .in { padding: 0 12px 12px; }

/* Jauges et barres */
.jauges { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.jauge { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px; }
.jauge b { font-family: var(--font-display); font-size: 26px; font-weight: 700; font-variant-numeric: tabular-nums; display: block; }
.barre { height: 7px; border-radius: 4px; background: #E3EAE7; overflow: hidden; }
.barre i { display: block; height: 100%; background: var(--accent); border-radius: 4px; }
.notion { display: flex; flex-direction: column; gap: 5px; }
.notion .tete { display: flex; justify-content: space-between; gap: 10px; font-size: 14.5px; }
.notion .tete span:last-child { font-variant-numeric: tabular-nums; color: var(--ink-2); white-space: nowrap; }

/* Révisions */
.flash { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 22px 18px; min-height: 230px; display: flex; flex-direction: column; gap: 14px; justify-content: center; }
.flash .q { font-family: var(--font-display); font-size: 21px; font-weight: 600; line-height: 1.3; }
.flash .r { border-top: 1px solid var(--line); padding-top: 14px; font-size: 16px; }
.notes4 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.notes4 button { border: 1px solid var(--line); background: var(--surface); border-radius: 11px; padding: 8px 2px; font-size: 13px; font-weight: 600; min-height: 54px; display: flex; flex-direction: column; align-items: center; gap: 2px; }
.notes4 button span { font-weight: 400; font-size: 11.5px; color: var(--ink-3); }
.etapes { display: flex; gap: 4px; }
.etapes i { flex: 1; height: 5px; border-radius: 3px; background: #DDE5E2; }
.etapes i.fait { background: var(--accent); }
.question { width: 100%; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 11px 12px; display: flex; flex-direction: column; gap: 4px; }
.question.posee { border-color: var(--ink-3); background: #F7FAF9; }
.question .rep { color: var(--ink-2); font-size: 14.5px; }
.option { width: 100%; text-align: left; background: var(--surface); border: 1.5px solid var(--line); border-radius: 12px; padding: 12px; }
.option[aria-pressed="true"] { border-color: var(--ink); background: #F7FAF9; }
.bandeau { font-size: 12.5px; color: var(--ink-2); background: #E9EFEC; border-radius: 10px; padding: 8px 12px; }
@media (max-width: 360px) { .fiche { grid-template-columns: minmax(0, 1fr); } .notes4 { gap: 4px; } }
@media (prefers-reduced-motion: no-preference) { .barre i { transition: width .3s; } }

/* Lot 2 : information clé, cartes structurées, fiches détaillées */
mark { background: linear-gradient(transparent 58%, #B9E4D7 58%); color: inherit; font-weight: 700; padding: 0 1px; }
.cle { font-family: var(--font-display); font-size: 19px; line-height: 1.35; font-weight: 600; }
dl.pts { margin: 0; display: flex; flex-direction: column; gap: 0; }
dl.pts > div { display: grid; grid-template-columns: 112px minmax(0, 1fr); gap: 10px; padding: 8px 0; border-top: 1px solid var(--line); }
dl.pts dt { font-size: 12.5px; font-weight: 600; color: var(--ink-3); padding-top: 2px; }
dl.pts dd { margin: 0; font-size: 15px; }
dl.pts > div:has(> dd:only-child) { grid-template-columns: minmax(0, 1fr); }
.flash .r { display: flex; flex-direction: column; gap: 10px; }
select { width: 100%; font: inherit; font-size: 16px; color: var(--ink); border: 1px solid var(--ink-3); border-radius: 10px; padding: 9px 11px; background: var(--surface); min-height: 44px; }
.lien { background: none; border: 0; padding: 0; color: var(--accent); text-decoration: underline; font-size: inherit; }
.chip.e-due { background: var(--ink); color: #fff; border-color: var(--ink); }
.chip.e-nouv { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
.chip.e-susp { border-style: dashed; }
.carte-l { align-items: flex-start; }
.sommaire { padding: 2px 0; }
.fsec { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 10px; scroll-margin-top: 44px; }
.fsec h3 { margin-top: 6px; }
.fsec ul { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 6px; font-size: 15px; }
.fsec.ci { border-top: 4px solid var(--g-ci); }
.fsec.mecanisme { border-top: 4px solid var(--ink); }
.fsec.posologies { border-top: 4px solid var(--accent); }
.graves { border-left: 4px solid var(--g-ci); padding-left: 10px; }
.inter { border: 1px solid var(--line); border-radius: 0 10px 10px 0; padding: 9px 11px; display: flex; flex-direction: column; gap: 4px; align-items: flex-start; }
.gas { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.ga { border: 1px solid var(--line); border-radius: 12px; padding: 10px; display: flex; flex-direction: column; gap: 6px; align-items: flex-start; font-size: 14px; }
.tablew { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th { text-align: left; font-size: 12px; color: var(--ink-3); font-weight: 600; padding: 6px 8px 6px 0; border-bottom: 1px solid var(--ink-3); }
td { padding: 8px 8px 8px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
.cours { border-left: 5px solid var(--ink); border-radius: 0 14px 14px 0; }
.reflexe { background: var(--accent-soft); border-radius: 10px; padding: 9px 12px; font-weight: 600; font-size: 14.5px; }
.elim { background: var(--g-ci-bg); color: var(--g-ci); border-radius: 12px; padding: 12px 14px; }
.methode { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; font-size: 14.5px; }
@media (max-width: 360px) { dl.pts > div { grid-template-columns: minmax(0, 1fr); gap: 2px; } .gas { grid-template-columns: minmax(0, 1fr); } }
@media (max-width: 380px) { nav.tabs { padding-left: 0; padding-right: 0; } nav.tabs button { font-size: 9.5px; letter-spacing: -0.03em; } nav.tabs button svg { width: 20px; height: 20px; } }

/* Les blocs d'un écran ne doivent jamais se tasser : sur iPhone, le contenu débordait de sa carte. */
main > * { flex-shrink: 0; }
.flash { min-height: 0; padding: 20px 18px; }
.sous { padding: 8px; background: var(--surface); border: 1px dashed var(--ink-3); border-radius: 10px; }
.editeur button.chip { white-space: normal; text-align: left; border-radius: 12px; }
.chip.bon { outline: 2px solid var(--ok); }
.zone button.chip { white-space: normal; text-align: left; border-radius: 12px; }

.grav.ok { background: var(--ok-bg); color: var(--ok); }
.wrap > button.chip { white-space: normal; text-align: left; border-radius: 12px; max-width: 100%; }
</style>
</head>

<div id="app"></div>
<script>

   "a_verifier" = écrit de mémoire. */

/* Logique pure : répétition espacée (FSRS-5, paramètres par défaut), correction, statistiques. */
const FSRS = (() => {
  const W = [0.40255, 1.18385, 3.173, 15.69105, 7.1949, 0.5345, 1.4604, 0.0046, 1.54575, 0.1192, 1.01925, 1.9395, 0.11, 0.29605, 2.2698, 0.2315, 2.9898, 0.51655, 0.6621];
  const F = 19 / 81, C = -0.5, RETENTION = 0.9;
  const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
  const retr = (t, s) => Math.pow(1 + F * t / s, C);
  const interval = (s) => Math.max(1, Math.round((s / F) * (Math.pow(RETENTION, 1 / C) - 1)));
  const d0 = (g) => clamp(W[4] - Math.exp(W[5] * (g - 1)) + 1, 1, 10);
  const nextD = (d, g) => clamp(W[7] * d0(4) + (1 - W[7]) * (d + (-W[6] * (g - 3)) * (10 - d) / 9), 1, 10);
  const sOk = (d, s, r, g) => s * (1 + (11 - d) * Math.pow(s, -W[9]) * (Math.exp(W[10] * (1 - r)) - 1) * (g === 2 ? W[15] : 1) * (g === 4 ? W[16] : 1) * Math.exp(W[8]));
  const sFail = (d, s, r) => Math.min(W[11] * Math.pow(d, -W[12]) * (Math.pow(s + 1, W[13]) - 1) * Math.exp(W[14] * (1 - r)), s);
  /* card : {s, d, last, due, reps, lapses} ou undefined. g : 1 à revoir, 2 difficile, 3 correct, 4 facile. day : numéro du jour. */
  function review(card, g, day) {
    let s, d;
    if (!card || !card.reps) { s = W[g - 1]; d = d0(g); }
    else {
      const r = retr(Math.max(0, day - card.last), card.s);
      s = g === 1 ? sFail(card.d, card.s, r) : sOk(card.d, card.s, r, g);
      d = nextD(card.d, g);
    }
    s = Math.max(s, 0.01);
    return { s, d, last: day, due: g === 1 ? day : day + interval(s), reps: ((card && card.reps) || 0) + 1, lapses: ((card && card.lapses) || 0) + (g === 1 ? 1 : 0), first: card && card.first !== undefined ? card.first : day };
  }
  const preview = (card, day) => [1, 2, 3, 4].map(g => { const n = review(card, g, day); return n.due - day; });
  return { review, preview, retr, interval, W };
})();

/* ---------- Correction d'une ordonnance ---------- */
/* flags : [{ligne, type, partenaires:[], priorite:1|2, note}] */
function matchFlag(flag, p) {
  const part = flag.partenaires || [];
  /* Problème porté par une seule ligne (posologie) : le médicament lui-même, signalé sans association. */
  if (p.lignes.length === 1) return p.cle.includes(flag.ligne) && !part.length;
  const set = [flag.ligne].concat(part);
  if (!set.some(l => p.cle.includes(l))) return false;
  if (!part.length) return true;
  return set.filter(l => p.lignes.includes(l)).length >= 2;
}
function corrigerOrdo(ordo, flags) {
  const used = new Set();
  const problemes = ordo.problemes.map(p => {
    const ms = flags.map((f, i) => ({ f, i })).filter(x => matchFlag(x.f, p));
    ms.forEach(x => used.add(x.i));
    return {
      p, trouve: ms.length > 0,
      niveau: ms.some(x => p.sfpc.includes(x.f.sfpc)),
      interv: ms.some(x => p.interv.includes(x.f.inter)),
      priorite: ms.some(x => x.f.priorite === p.priorite),
      notes: ms.map(x => x.f.note).filter(Boolean)
    };
  });
  const nonAttendus = flags.filter((f, i) => !used.has(i));
  return { problemes, nonAttendus };
}
const AUTO = { juste: 1, incomplet: 0.5, absent: 0 };
/* auto : {pid: {mecanisme:'juste'|'incomplet'|'absent', conduite:...}} */
function scoreOrdo(correction, auto) {
  let score = 0, max = 0; const details = [];
  correction.problemes.forEach(c => {
    const a = (auto && auto[c.p.id]) || {};
    const pts = !c.trouve ? 0 : 1 + (c.niveau ? 1 : 0) + (c.interv ? 1 : 0) + (c.priorite ? 1 : 0) + (AUTO[a.mecanisme] || 0) + (AUTO[a.conduite] || 0);
    score += pts; max += 6;
    details.push({ notion: c.p.notion, score: pts, max: 6, trouve: c.trouve });
  });
  return { score, max, details };
}

/* ---------- Correction d'un cas ---------- */
function scoreCas(cas, posees, hypAuto, optionId) {
  const att = cas.questions.filter(q => q.attendue);
  const ok = att.filter(q => posees.includes(q.id)).length;
  const inutiles = cas.questions.filter(q => !q.attendue && posees.includes(q.id)).length;
  const qPts = Math.max(0, ok / att.length * 2 - inutiles * 0.25);
  const hPts = (AUTO[hypAuto] || 0) * 1;
  const opt = cas.options.find(o => o.id === optionId);
  const bon = !!(opt && opt.correct);
  /* Critère éliminatoire : mauvaise prise en charge ou orientation manquée = cas non validé, quel que soit le reste. */
  const total = bon ? Math.round((qPts + hPts + 2) * 100) / 100 : 0;
  return { score: total, max: 5, questionsOk: ok, questionsAttendues: att.length, inutiles, decisionOk: bon, elimine: !bon,

}

/* ---------- Statistiques ---------- */
/* store : {cards:{}, reviews:[{id,g,day}], attempts:[{kind,id,day,score,max,details}], days:{}} */
function stats(store, data, day) {
  const notions = {};
  Object.keys(data.NOTIONS).forEach(n => { notions[n] = { id: n, label: data.NOTIONS[n], sais: [0, 0], applique: [0, 0], rates: 0 }; });
  const cardById = {}; data.CARDS.forEach(c => { cardById[c.id] = c; });
  store.reviews.forEach(r => {
    const c = cardById[r.id]; if (!c || !notions[c.notion]) return;
    notions[c.notion].sais[1] += 1; if (r.g >= 2) notions[c.notion].sais[0] += 1;
  });
  store.attempts.forEach(a => (a.details || []).forEach(d => {
    const n = notions[d.notion]; if (!n) return;
    n.applique[0] += d.score; n.applique[1] += d.max; if (!d.trouve) n.rates += 1;
  }));
  const pct = (x) => x[1] ? Math.round(x[0] / x[1] * 100) : null;
  const tot = (k) => { const t = [0, 0]; Object.values(notions).forEach(n => { t[0] += n[k][0]; t[1] += n[k][1]; }); return pct(t); };
  const list = Object.values(notions).map(n => {
    const s = pct(n.sais), a = pct(n.applique);
    const vals = [s, a].filter(v => v !== null);
    return { id: n.id, label: n.label, sais: s, applique: a, rates: n.rates, global: vals.length ? Math.min.apply(null, vals) : null };
  });
  const travaillees = list.filter(n => n.global !== null).sort((x, y) => x.global - y.global);
  const due = data.CARDS.filter(c => { const k = store.cards[c.id]; return k && k.reps && k.due <= day; });
  const nouvelles = data.CARDS.filter(c => !(store.cards[c.id] && store.cards[c.id].reps));
  let serie = 0; for (let d = day; store.days[d]; d--) serie++;
  if (!store.days[day]) { serie = 0; for (let d = day - 1; store.days[d]; d--) serie++; }
  return { sais: tot("sais"), applique: tot("applique"), notions: list, lacunes: travaillees.filter(n => n.global < 70).slice(0, 4),
    recurrentes: list.filter(n => n.rates >= 2), due, nouvelles, serie };
}
function fileRevision(store, data, day, maxNouvelles) {
  const s = stats(store, data, day);
  /* Limite quotidienne : les cartes découvertes aujourd'hui comptent dans le quota. */
  const dejaVues = Object.values(store.cards).filter(k => k.first === day).length;
  return s.due.concat(s.nouvelles.slice(0, Math.max(0, maxNouvelles - dejaVues))).map(c => c.id);
}

      <div class="stack" style="gap:6px"><label>4 · Identification du problème</label><div class="wrap">${D.SFPC.problemes.map(([k, t]) => `<button class="chip" data-a="draft-cat" data-n="${k}" aria-pressed="${d.cat === k}">${k} · ${esc(t)}</button>`).join("")}</div>
        ${d.cat === "3" ? `<div class="wrap sous">${D.SFPC.inter.map(([k, t, g]) => g ? `<button class="grav ${g}" data-a="draft-sfpc" data-n="${k}" aria-pressed="${d.sfpc === k}">${forme(g)}${k} · ${esc(t)}</button>` : `<button class="chip" data-a="draft-sfpc" data-n="${k}" aria-pressed="${d.sfpc === k}">${k} · ${esc(t)}</button>`).join("")}</div>` : ""}</div>

  const autoEval = (pid, champ, label) => { const v = (S.ordo.auto[pid] || {})[champ]; return `<div class="stack" style="gap:5px"><span class="small">${label}</span><div class="auto">${AUTO_LABEL.map(([k, t]) => `<button data-a="auto" data-p="${pid}" data-c="${champ}" data-v="${k}" aria-pressed="${v === k}">${t}</button>`).join("")}</div></div>`; };
  function blocProbleme(o, c) {
    const p = c.p;
    return `<article class="corr bord-${p.niveau}">
      <div class="zone stack" style="gap:8px"><h3>1 · Problème</h3><h2>${esc(p.titre)}</h2><div class="wrap">${grav(p.niveau, true)}<span class="chip">${p.priorite === 1 ? "Appel avant délivrance" : "Délivrer et surveiller"}</span></div>

      <div class="zone stack" style="gap:6px"><h3>Votre hypothèse</h3><p class="note-moi">${esc(k.hyp)}</p>${k.saved ? "" : `<div class="auto">${[["juste", "Juste"], ["incomplet", "Incomplète"], ["absent", "Fausse"]].map(([v, t]) => `<button data-a="cas-auto" data-v="${v}" aria-pressed="${k.hypAuto === v}">${t}</button>`).join("")}</div>`}</div></article>

  /* ---------- Médicaments ---------- */

  function vMeds() {
    if (S.med) {
      const m = D.DRUGS[S.med];
      const ou = D.ORDOS.filter((o) => o.lignes.some((l) => l.drug === S.med)).map((o) => `<button class="chip" data-a="ordo-open" data-id="${o.id}">Ordonnance : ${esc(o.titre)}</button>`).concat(D.CAS.filter((c) => c.drugs.includes(S.med)).map((c) => `<button class="chip" data-a="cas-open" data-id="${c.id}">Cas : ${esc(c.titre)}</button>`));
      return `<div><button class="back" data-a="med-close">${ic("retour").replace("<svg", '<svg width="18" height="18"')} Médicaments</button><h1>${esc(m.dci)}</h1><p class="muted">${esc(m.classe)}</p></div>
      <button class="btn block" data-a="cartes-drug" data-id="${S.med}">${ic("cartes").replace("<svg", '<svg width="18" height="18" style="vertical-align:-3px"')} Cartes liées (${toutesCartes().filter((k) => k.drug === S.med).length})</button>
      ${m.complet ? ficheComplete(S.med) : fiche(S.med) + `<p class="bandeau">Fiche courte. La version détaillée arrive avec le prochain lot.</p>`}${ou.length ? `<section class="stack"><h3>Pour s'entraîner</h3><div class="wrap">${ou.join("")}</div></section>` : ""}`;
    }
    return `<header><h1>Médicaments</h1><p class="muted">Posologie, alertes et conseils, toujours au même endroit.</p></header>
    <input type="search" id="recherche" data-i="med-q" placeholder="Ramipril, statine, AINS" value="${esc(S.q)}" aria-label="Rechercher un médicament ou une classe">
    <section class="stack" id="liste-meds">${medsListe()}</section>`;
  }

  /* ---------- Révisions ---------- */
  const fmtJ = (n) => (n <= 0 ? "ce jour" : n === 1 ? "1 jour" : n < 30 ? n + " jours" : Math.round(n / 30) + " mois");
  function vRev() {
    const r = S.rev, tete = `<div><button class="back" data-a="rev-close">${ic("retour").replace("<svg", '<svg width="18" height="18"')} Accueil</button><h1>Révisions</h1></div>`;
    if (!r.file.length) return `${tete}<section class="card stack"><h2>${r.fait ? "Séance terminée" : "Rien à réviser aujourd'hui"}</h2><p class="muted">${r.fait ? `${r.fait} réponse${r.fait > 1 ? "s" : ""} enregistrée${r.fait > 1 ? "s" : ""}. Les cartes reviendront au bon moment.` : "Les prochaines cartes arriveront à leur date."}</p></section><button class="btn block" data-a="rev-close">Retour à l'accueil</button>`;
    const c = toutesCartes().find((x) => x.id === r.file[0]);
    if (!c) { r.file.shift(); return vRev(); }
    const pv = C.FSRS.preview(store.cards[c.id], day());
    return `${tete}<p class="muted">Encore ${r.file.length} carte${r.file.length > 1 ? "s" : ""} · ${esc(D.NOTIONS[c.notion])}</p>
    <section class="flash"><p class="q">${esc(c.recto)}</p>${r.montre ? `<div class="r">${verso(c)}</div>` : ""}</section>
    ${r.montre ? `<div class="notes4">${[["À revoir", 1], ["Difficile", 2], ["Correct", 3], ["Facile", 4]].map(([t, g]) => `<button data-a="rev-note" data-g="${g}">${t}<span>${g === 1 ? "tout de suite" : fmtJ(pv[g - 1])}</span></button>`).join("")}</div><p class="small">Répondez de tête avant de regarder, puis notez-vous honnêtement. <button class="lien" data-a="carte-edit" data-id="${c.id}">Modifier cette carte</button></p>` : `<button class="btn primary block" data-a="rev-montrer">Voir la réponse</button>`}`;
  }

  /* ---------- Cartes : parcourir, trier, modifier, ajouter ---------- */
  const etatCarte = (c) => {
    const k = store.cards[c.id];
    if (store.susp[c.id]) return { code: "susp", txt: "Suspendue", ord: 1e9, d: 0 };
    if (!k || !k.reps) return { code: "nouv", txt: "Nouvelle", ord: 1e8, d: 0 };
    const j = k.due - day();
    return { code: j <= 0 ? "due" : "appr", txt: j <= 0 ? "À réviser" : "Dans " + fmtJ(j), ord: j, d: k.d };
  };
  const ETATS = [["toutes", "Toutes"], ["due", "À réviser"], ["nouv", "Nouvelles"], ["appr", "Apprises"], ["susp", "Suspendues"], ["perso", "Mes cartes"]];
  function cartesFiltrees() {
    const f = S.cartes, q = f.q.trim().toLowerCase();
    const l = toutesCartes().map((c) => ({ c, e: etatCarte(c) })).filter(({ c, e }) =>
      (!f.drug || c.drug === f.drug) && (f.etat === "toutes" || (f.etat === "perso" ? c.perso : e.code === f.etat)) &&
      (!q || (c.recto + " " + c.cle + " " + pointsVersTexte(c.points) + " " + (D.NOTIONS[c.notion] || "") + " " + (c.drug ? D.DRUGS[c.drug].dci : "")).toLowerCase().includes(q)));
    const tri = { echeance: (a, b) => a.e.ord - b.e.ord, notion: (a, b) => (D.NOTIONS[a.c.notion] || "").localeCompare(D.NOTIONS[b.c.notion] || "", "fr"), difficulte: (a, b) => b.e.d - a.e.d, medicament: (a, b) => (a.c.drug || "zz").localeCompare(b.c.drug || "zz", "fr") }[f.tri];
    if (tri) l.sort(tri);
    f.ids = l.map((x) => x.c.id);
    return l;
  }
  const listeCartes = () => { const l = cartesFiltrees(); return `<p class="small">${l.length} carte${l.length > 1 ? "s" : ""}</p>` + (l.length ? l.map(({ c, e }) => `<button class="card tap carte-l" data-a="carte-open" data-id="${c.id}"><span class="grow stack" style="gap:5px"><span style="font-weight:600">${esc(c.recto)}</span><span class="wrap"><span class="chip e-${e.code}">${e.txt}</span><span class="chip">${esc(D.NOTIONS[c.notion] || "Mes cartes")}</span>${c.perso ? `<span class="chip">Ma carte</span>` : c.modifiee ? `<span class="chip">Modifiée</span>` : ""}</span></span></button>`).join("") : `<p class="muted">Aucune carte ne correspond à ces filtres.</p>`); };
  function vCartes() {
    const f = S.cartes;
    if (f.edit) {
      const e = f.edit, opt = (v, t, cur) => `<option value="${v}" ${v === cur ? "selected" : ""}>${esc(t)}</option>`;
      return `<div><button class="back" data-a="carte-cancel">${ic("retour").replace("<svg", '<svg width="18" height="18"')} Annuler</button><h1>${e.id ? "Modifier la carte" : "Nouvelle carte"}</h1></div>
      <div class="stack champ"><label for="ce-recto">Question</label><textarea id="ce-recto" data-i="ce-recto" placeholder="Une question précise, qui annonce ce qu'on attend">${esc(e.recto)}</textarea></div>
      <div class="stack champ"><label for="ce-cle">Réponse clé</label><input type="text" id="ce-cle" data-i="ce-cle" value="${esc(e.cle)}" placeholder="Ce qu'il faut retenir en premier"></div>
      <div class="stack champ"><label for="ce-details">Détails, un par ligne</label><textarea id="ce-details" data-i="ce-details" style="min-height:130px" placeholder="Mécanisme : inhibition du CYP3A4">${esc(e.details)}</textarea><p class="small">Écrivez « Libellé : texte » pour créer une ligne titrée. Entourez de deux astérisques **ce qu'il faut mettre en valeur**.</p></div>
      <div class="stack champ"><label for="ce-notion">Notion</label><select id="ce-notion" data-i="ce-notion">${Object.keys(D.NOTIONS).map((n) => opt(n, D.NOTIONS[n], e.notion)).join("")}</select></div>
      <div class="stack champ"><label for="ce-drug">Médicament lié</label><select id="ce-drug" data-i="ce-drug">${opt("", "Aucun", e.drug)}${Object.keys(D.DRUGS).map((n) => opt(n, D.DRUGS[n].dci, e.drug)).join("")}</select></div>
      ${e.err ? `<p class="erreur" role="alert">${esc(e.err)}</p>` : ""}
      <button class="btn primary block" data-a="carte-save">Enregistrer la carte</button>`;
    }
    if (f.ouvert) {
      const c = toutesCartes().find((x) => x.id === f.ouvert);
      if (!c) { f.ouvert = null; return vCartes(); }
      if (!f.ids.includes(c.id)) cartesFiltrees();
      const e = etatCarte(c), k = store.cards[c.id], i = f.ids.indexOf(c.id);
      return `<div><button class="back" data-a="carte-close">${ic("retour").replace("<svg", '<svg width="18" height="18"')} Cartes</button><p class="small">${i >= 0 ? `Carte ${i + 1} sur ${f.ids.length}` : ""}</p></div>
      <section class="flash"><p class="q">${esc(c.recto)}</p><div class="r">${verso(c)}</div></section>
      <div class="row"><button class="btn grow" data-a="carte-nav" data-d="-1">Précédente</button><button class="btn grow" data-a="carte-nav" data-d="1">Suivante</button></div>
      <div class="wrap"><span class="chip e-${e.code}">${e.txt}</span><span class="chip">${esc(D.NOTIONS[c.notion] || "Mes cartes")}</span>${c.drug ? `<button class="chip" data-a="med-open" data-id="${c.drug}">Fiche ${esc(D.DRUGS[c.drug].dci)}</button>` : ""}${k && k.reps ? `<span class="chip">${k.reps} révision${k.reps > 1 ? "s" : ""}, ${k.lapses} oubli${k.lapses > 1 ? "s" : ""}</span>` : ""}</div>
      <div class="wrap"><button class="btn" data-a="carte-edit" data-id="${c.id}">Modifier</button><button class="btn" data-a="carte-susp" data-id="${c.id}">${store.susp[c.id] ? "Réactiver" : "Suspendre"}</button>${c.modifiee ? `<button class="btn ghost" data-a="carte-reset" data-id="${c.id}">Rétablir l'original</button>` : ""}${c.perso ? `<button class="btn ghost" data-a="carte-del">Supprimer</button>` : ""}</div>
      ${f.suppr ? `<p class="erreur" role="alert">Cette carte et son historique seront supprimés.</p><div class="row"><button class="btn primary" data-a="carte-del-ok" data-id="${c.id}">Supprimer</button><button class="btn ghost" data-a="carte-del-non">Annuler</button></div>` : ""}`;
    }
    const tris = [["echeance", "Échéance"], ["notion", "Notion"], ["medicament", "Médicament"], ["difficulte", "Difficulté"]];
    return `<header class="row"><div class="grow"><h1>Cartes</h1><p class="muted">Parcourir, modifier, ajouter.</p></div><button class="btn primary" data-a="carte-new">Nouvelle</button></header>
    <input type="search" id="carte-q" data-i="carte-q" placeholder="Rhabdomyolyse, apixaban, kaliémie" value="${esc(f.q)}" aria-label="Rechercher dans les cartes">
    ${f.drug ? `<div class="wrap"><span class="chip">Médicament : ${esc(D.DRUGS[f.drug].dci)}</span><button class="chip" data-a="cartes-drug-clear">Voir toutes les cartes</button></div>` : ""}
    <div class="wrap">${ETATS.map(([k, t]) => `<button class="chip" data-a="cartes-etat" data-e="${k}" aria-pressed="${f.etat === k}">${t}</button>`).join("")}</div>
    <div class="row"><label class="small" for="carte-tri">Trier par</label><select id="carte-tri" data-i="carte-tri" class="grow">${tris.map(([k, t]) => `<option value="${k}" ${f.tri === k ? "selected" : ""}>${t}</option>`).join("")}</select></div>
    <section class="stack" id="liste-cartes">${listeCartes()}</section>`;
  }

  /* ---------- Progrès ---------- */
  function vProgres() {
    const st = C.stats(store, DV(), day());
    const ligne = (n) => `<div class="notion"><div class="tete"><span>${esc(n.label)}</span><span>${n.global === null ? "Pas encore travaillée" : `Je sais ${pct(n.sais)} · J'applique ${pct(n.applique)}`}</span></div><div class="barre"><i style="width:${n.global || 0}%"></i></div></div>`;
    const tri = st.notions.slice().sort((a, b) => (a.global === null) - (b.global === null) || a.global - b.global);
    const meds = {}, plus = (id) => { meds[id] = (meds[id] || 0) + 1; };
    store.attempts.forEach((a) => (a.details || []).filter((d) => !d.trouve).forEach((d) => {
      if (a.kind === "ordo") {
        const o = D.ORDOS.find((x) => x.id === a.id); if (!o) return;
        const ids = new Set(); o.problemes.filter((p) => p.notion === d.notion).forEach((p) => p.cle.forEach((l) => { const dr = o.lignes.find((y) => y.id === l).drug; if (dr) ids.add(dr); }));
        ids.forEach(plus);
      } else { const c = D.CAS.find((x) => x.id === a.id); if (c) c.drugs.forEach(plus); }
    }));
    const medsTri = Object.keys(meds).sort((a, b) => meds[b] - meds[a]).slice(0, 5);
    const o = S.outil || {};
    return `<header><h1>Progrès</h1><p class="muted">Ce que vous savez, et ce que vous savez appliquer.</p></header>
    <section class="jauges"><div class="jauge"><span class="small">Je sais</span><b>${pct(st.sais)}</b><span class="small">${store.reviews.length} réponse${store.reviews.length > 1 ? "s" : ""} aux cartes</span></div><div class="jauge"><span class="small">Je sais appliquer</span><b>${pct(st.applique)}</b><span class="small">${store.attempts.length} exercice${store.attempts.length > 1 ? "s" : ""}</span></div></section>
    <section class="card stack"><h2>Par notion</h2>${tri.map(ligne).join("")}</section>
    <section class="card stack"><h2>Erreurs récurrentes</h2>${st.recurrentes.length ? st.recurrentes.map((n) => `<p>${esc(n.label)} : manquée ${n.rates} fois</p>`).join("") : `<p class="muted">Une notion apparaît ici quand elle est manquée au moins deux fois.</p>`}</section>
    <section class="card stack"><h2>Médicaments à revoir</h2>${medsTri.length ? `<div class="wrap">${medsTri.map((id) => `<button class="chip" data-a="med-open" data-id="${id}">${esc(D.DRUGS[id].dci)} · ${meds[id]}</button>`).join("")}</div>` : `<p class="muted">Les médicaments liés à vos erreurs apparaîtront ici.</p>`}</section>
    <section class="card stack"><h2>Code visuel</h2><div class="wrap">${Object.keys(D.NIVEAUX).map((n) => grav(n, true)).join("")}</div><p class="small">Une couleur et une forme par niveau, partout dans l'application.</p></section>
    <section class="card stack"><h2>Sauvegarde</h2>
      <p class="muted">${etatNuage === "ok" ? "Votre progression est enregistrée dans votre compte, à chaque réponse. Vous la retrouvez en rouvrant l'application, sur n'importe quel appareil connecté au même compte." : etatNuage === "attente" ? "Connexion à la sauvegarde en cours…" : etatNuage === "erreur" ? "Le dernier enregistrement dans votre compte a échoué. La progression reste sur cet appareil ; il sera retenté à la prochaine réponse." : stockageOk ? "Votre progression est enregistrée sur ce téléphone, à chaque réponse. Elle ne dépend d'aucun compte. Pour ne jamais la perdre, exportez-la régulièrement." : "Aucun enregistrement possible ici : la progression sera perdue en fermant la page."}</p>
      <p class="small">${dernierExport() ? "Dernier fichier exporté le " + new Date(dernierExport()).toLocaleDateString("fr-FR") + "." : "Aucun fichier exporté pour l'instant."} Exportez une fois par semaine : c'est la copie qui survit à un changement de téléphone.</p>
      <button class="btn primary block" data-a="sv-exporter">Exporter ma sauvegarde</button>
      <label class="btn block" for="sv-fichier" style="text-align:center">Restaurer depuis un fichier<input type="file" id="sv-fichier" accept=".json,application/json,text/plain" style="position:absolute;opacity:0;width:1px;height:1px"></label>
      <div class="wrap"><button class="btn ghost" data-a="sv-copier">Copier en texte</button><button class="btn ghost" data-a="sv-ouvrir">Coller un texte</button><button class="btn ghost" data-a="sv-reset">Tout effacer</button></div>
      ${o.msg ? `<p class="bandeau" role="status">${esc(o.msg)}</p>` : ""}
      ${o.mode === "copie" ? `<label class="small" for="sv-out">Copie automatique impossible ici. Sélectionnez ce texte et copiez-le.</label><textarea id="sv-out" readonly>${esc(JSON.stringify(store))}</textarea>` : ""}
      ${o.mode === "restaurer" ? `<label class="small" for="sv-in">Collez ici une sauvegarde copiée plus tôt.</label><textarea id="sv-in" data-i="sv-in"></textarea>${o.err ? `<p class="erreur" role="alert">${esc(o.err)}</p>` : ""}<button class="btn primary" data-a="sv-restaurer">Restaurer cette sauvegarde</button>` : ""}
      ${o.mode === "reset" ? `<p class="erreur" role="alert">Toute la progression sera effacée de cet appareil.</p><div class="row"><button class="btn primary" data-a="sv-reset-ok">Effacer</button><button class="btn ghost" data-a="sv-annuler">Annuler</button></div>` : ""}
    </section>
    <p class="bandeau">Outil de formation. Chaque donnée porte son statut et sa source ; le RCP et le jugement professionnel font foi.</p>`;
  }

  /* ---------- Rendu ---------- */
  const app = document.getElementById("app");
  function vue() {
    if (S.rev) return vRev();
    if (S.tab === "ordonnances") return S.ordo ? (S.ordo.phase === "analyse" ? vOrdoAnalyse() : vOrdoCorrection()) : vOrdoListe();
    if (S.tab === "cas") return S.cas ? vCas() : vCasListe();
    if (S.tab === "medicaments") return vMeds();
    if (S.tab === "cartes") return vCartes();
    if (S.tab === "progres") return vProgres();
    return vAccueil();
  }
  function render(haut) {
    const m = app.querySelector("main"), y = m ? m.scrollTop : 0;
    app.innerHTML = `<main id="contenu" tabindex="-1">${vue()}</main><nav class="tabs" aria-label="Sections">${TABS.map((t) => `<button data-a="tab" data-t="${t}" ${S.tab === t && !S.rev ? 'aria-current="page"' : ""}>${ic(t)}${TAB_LABEL[t]}</button>`).join("")}</nav>`;
    app.querySelector("main").scrollTop = haut ? 0 : y;
  }
  const aller = (tab) => { S.tab = tab; S.rev = null; try { if (location.hash !== "#" + tab) location.hash = tab; } catch (e) { /* cadre sans accès à l'adresse */ } };
  const draftVide = () => ({ cat: null, sfpc: null, inter: null, partenaires: [], priorite: null, note: "" });

  /* ---------- Actions ---------- */
  const A = {
    tab: (d) => { aller(d.t); if (d.t !== "medicaments") S.med = null; render(true); },
    filtre: (d) => { S.filtre.niveau = +d.n; render(); },
    theme: (d) => { S.filtre.theme = d.n || null; render(); },
    dom: (d) => { S.filtre.dom = d.n || null; render(); },
    "ordo-open": (d) => { aller("ordonnances"); S.ordo = { id: d.id, phase: "analyse", flags: [], ouvert: null, draft: draftVide(), err: "", auto: {}, saved: false, confirmVide: false }; render(true); },
    "ordo-close": () => { S.ordo = null; render(true); },
    "ligne-open": (d) => { S.ordo.ouvert = S.ordo.ouvert === d.l ? null : d.l; S.ordo.draft = draftVide(); S.ordo.err = ""; S.ordo.confirmVide = false; render(); },
    "ligne-close": () => { S.ordo.ouvert = null; S.ordo.err = ""; render(); },
    "draft-cat": (d) => { S.ordo.draft.cat = d.n; S.ordo.draft.sfpc = d.n === "3" ? null : d.n; S.ordo.err = ""; render(); },
    "draft-sfpc": (d) => { S.ordo.draft.sfpc = d.n; S.ordo.err = ""; render(); },
    "draft-inter": (d) => { S.ordo.draft.inter = d.n; S.ordo.err = ""; render(); },
    dev: (d) => { (S.ordo.dev = S.ordo.dev || {})[d.p] = d.n; render(); },
    "draft-part": (d) => { const p = S.ordo.draft.partenaires, i = p.indexOf(d.l); if (i < 0) p.push(d.l); else p.splice(i, 1); render(); },
    "draft-prio": (d) => { S.ordo.draft.priorite = +d.n; S.ordo.err = ""; render(); },
    "flag-add": (d) => {
      const f = S.ordo.draft;
      if (!f.cat) { S.ordo.err = "Choisissez un type de problème."; return render(); }
      if (!f.sfpc) { S.ordo.err = "Précisez le niveau de l'interaction."; return render(); }
      if (!f.inter) { S.ordo.err = "Choisissez l'intervention."; return render(); }
      if (!f.priorite) { S.ordo.err = "Indiquez la priorité."; return render(); }
      S.ordo.flags.push({ ligne: d.l, sfpc: f.sfpc, inter: f.inter, partenaires: f.partenaires.slice(), priorite: f.priorite, note: f.note.trim() });
      S.ordo.ouvert = null; S.ordo.draft = draftVide(); S.ordo.err = ""; S.ordo.confirmVide = false; render();
    },
    "flag-del": (d) => { S.ordo.flags.splice(+d.i, 1); render(); },
    "ordo-valider": () => {
      if (!S.ordo.flags.length && !S.ordo.confirmVide) { S.ordo.confirmVide = true; return render(); }
      S.ordo.cor = C.corrigerOrdo(ordoCourante(), S.ordo.flags); S.ordo.phase = "correction"; S.ordo.err = ""; render(true);
    },
    auto: (d) => { (S.ordo.auto[d.p] = S.ordo.auto[d.p] || {})[d.c] = d.v; S.ordo.err = ""; render(); },
    "ordo-save": () => {
      const manque = S.ordo.cor.problemes.some((c) => c.trouve && !((S.ordo.auto[c.p.id] || {}).mecanisme && (S.ordo.auto[c.p.id] || {}).conduite));
      if (manque) { S.ordo.err = "Évaluez votre mécanisme et votre conduite pour chaque problème trouvé."; return render(); }
      const sc = C.scoreOrdo(S.ordo.cor, S.ordo.auto);
      store.attempts.push({ kind: "ordo", id: S.ordo.id, day: day(), score: sc.score, max: sc.max, details: sc.details });
      marquerJour(); save(); S.ordo.saved = true; S.ordo.err = ""; render();
    },
    "cas-open": (d) => { aller("cas"); S.cas = { id: d.id, etape: 1, posees: [], hyp: "", option: null, hypAuto: null, err: "", saved: false }; render(true); },
    "cas-close": () => { S.cas = null; render(true); },
    "cas-q": (d) => { if (!S.cas.posees.includes(d.q)) S.cas.posees.push(d.q); S.cas.err = ""; render(); },
    "cas-opt": (d) => { S.cas.option = d.o; S.cas.err = ""; render(); },
    "cas-auto": (d) => { S.cas.hypAuto = d.v; S.cas.err = ""; render(); },
    "cas-next": () => {
      const k = S.cas;
      if (k.etape === 2 && !k.posees.length) { k.err = "Posez au moins une question avant de continuer."; return render(); }
      if (k.etape === 3 && !k.hyp.trim()) { k.err = "Écrivez votre hypothèse, même en quelques mots."; return render(); }
      if (k.etape === 4 && !k.option) { k.err = "Choisissez une décision."; return render(); }
      k.err = ""; k.etape++; render(true);
    },
    "cas-save": () => {
      const k = S.cas;
      if (!k.hypAuto) { k.err = "Évaluez votre hypothèse avant d'enregistrer."; return render(); }
      const sc = C.scoreCas(casCourant(), k.posees, k.hypAuto, k.option);
      store.attempts.push({ kind: "cas", id: k.id, day: day(), score: sc.score, max: sc.max, details: sc.details });
      marquerJour(); save(); k.saved = true; k.err = ""; render();
    },
    "med-open": (d) => { aller("medicaments"); S.med = d.id; render(true); },
    "med-close": () => { S.med = null; render(true); },
    "rev-start": () => { S.rev = { file: C.fileRevision(store, DV(), day(), 8), montre: false, fait: 0 }; render(true); },
    "rev-close": () => { aller("accueil"); render(true); },
    "rev-montrer": () => { S.rev.montre = true; render(); },
    "rev-note": (d) => {
      const g = +d.g, id = S.rev.file.shift();
      store.cards[id] = C.FSRS.review(store.cards[id], g, day()); store.reviews.push({ id, g, day: day() });
      if (g === 1) S.rev.file.push(id);
      S.rev.montre = false; S.rev.fait++; marquerJour(); save(); render(true);
    },
    saut: (d) => { const el = document.getElementById("f-" + d.s); if (el) el.scrollIntoView({ block: "start" }); },
    "cartes-drug": (d) => { aller("cartes"); Object.assign(S.cartes, { drug: d.id, etat: "toutes", q: "", ouvert: null, edit: null }); render(true); },
    "cartes-drug-clear": () => { S.cartes.drug = null; render(); },
    "cartes-etat": (d) => { S.cartes.etat = d.e; render(); },
    "carte-open": (d) => { S.cartes.ouvert = d.id; S.cartes.suppr = false; render(true); },
    "carte-close": () => { S.cartes.ouvert = null; render(true); },
    "carte-nav": (d) => { const i = S.cartes.ids.indexOf(S.cartes.ouvert) + +d.d; if (i >= 0 && i < S.cartes.ids.length) { S.cartes.ouvert = S.cartes.ids[i]; S.cartes.suppr = false; render(true); } },
    "carte-new": () => { S.cartes.edit = { id: null, recto: "", cle: "", details: "", notion: "perso", drug: S.cartes.drug || "", err: "" }; render(true); },
    "carte-edit": (d) => { const c = toutesCartes().find((x) => x.id === d.id); if (!c) return; aller("cartes"); S.cartes.ouvert = c.id; S.cartes.edit = { id: c.id, recto: c.recto, cle: c.cle, details: pointsVersTexte(c.points), notion: c.notion, drug: c.drug || "", err: "" }; render(true); },
    "carte-cancel": () => { S.cartes.edit = null; render(true); },
    "carte-save": () => {
      const e = S.cartes.edit;
      if (!e.recto.trim()) { e.err = "Écrivez la question."; return render(); }
      if (!e.cle.trim()) { e.err = "Écrivez la réponse clé : ce qu'il faut retenir en premier."; return render(); }
      const corps = { recto: e.recto.trim(), cle: e.cle.trim(), points: texteVersPoints(e.details), notion: e.notion, drug: e.drug || null };
      if (!e.id) { const id = "u" + Date.now().toString(36); store.custom.push(Object.assign({ id }, corps)); S.cartes.ouvert = id; }
      else if (D.CARDS.some((c) => c.id === e.id)) store.edits[e.id] = corps;
      else { const i = store.custom.findIndex((c) => c.id === e.id); if (i >= 0) store.custom[i] = Object.assign({ id: e.id }, corps); }
      save(); S.cartes.edit = null; render(true);
    },
    "carte-susp": (d) => { if (store.susp[d.id]) delete store.susp[d.id]; else store.susp[d.id] = 1; save(); render(); },
    "carte-reset": (d) => { delete store.edits[d.id]; save(); render(); },
    "carte-del": () => { S.cartes.suppr = true; render(); },
    "carte-del-non": () => { S.cartes.suppr = false; render(); },
    "carte-del-ok": (d) => { store.custom = store.custom.filter((c) => c.id !== d.id); delete store.cards[d.id]; delete store.susp[d.id]; save(); S.cartes.ouvert = null; S.cartes.suppr = false; render(true); },
    "sv-copier": () => {
      const txt = JSON.stringify(store), ok = () => { S.outil = { msg: "Sauvegarde copiée. Collez-la dans une note pour la garder." }; render(); }, ko = () => { S.outil = { mode: "copie" }; render(); };
      try { navigator.clipboard.writeText(txt).then(ok, ko); } catch (e) { ko(); }
    },
    "sv-ouvrir": () => { S.outil = { mode: "restaurer", txt: "" }; render(); },
    "sv-restaurer": () => {
      try { restaurerTexte(S.outil.txt); S.outil = { msg: "Progression restaurée." }; }
      catch (e) { S.outil.err = "Ce texte n'est pas une sauvegarde valide. Collez le texte complet, sans le modifier."; }
      render();
    },
    "sv-exporter": () => { exporter(); },
    "sv-reset": () => { S.outil = { mode: "reset" }; render(); },
    "sv-reset-ok": () => { store = vide(); save(); S.outil = { msg: "Progression effacée." }; render(); },
    "sv-annuler": () => { S.outil = null; render(); }
  };
  app.addEventListener("click", (e) => { const el = e.target.closest("[data-a]"); if (el && A[el.dataset.a]) A[el.dataset.a](el.dataset, el); });
  app.addEventListener("change", (e) => {
    if (e.target.id !== "sv-fichier" || !e.target.files || !e.target.files[0]) return;
    e.target.files[0].text().then((t) => { try { restaurerTexte(t); S.outil = { msg: "Progression restaurée depuis le fichier." }; } catch (er) { S.outil = { err: "", msg: "Ce fichier n'est pas une sauvegarde Officina valide." }; } render(); });
  });
  app.addEventListener("input", (e) => {
    const k = e.target.dataset.i, v = e.target.value;
    if (k === "draft-note") S.ordo.draft.note = v;
    else if (k === "cas-hyp") S.cas.hyp = v;
    else if (k === "sv-in") S.outil.txt = v;
    else if (k === "med-q") { S.q = v; document.getElementById("liste-meds").innerHTML = medsListe(); }
    else if (k === "carte-q") { S.cartes.q = v; document.getElementById("liste-cartes").innerHTML = listeCartes(); }
    else if (k === "carte-tri") { S.cartes.tri = v; document.getElementById("liste-cartes").innerHTML = listeCartes(); }
    else if (k && k.indexOf("ce-") === 0 && S.cartes.edit) S.cartes.edit[k.slice(3)] = v;
  });
  const depuisHash = () => { const h = (location.hash || "").slice(1); if (TABS.includes(h) && h !== S.tab) { S.tab = h; S.rev = null; render(true); } };
  window.addEventListener("hashchange", depuisHash);
  const h0 = (location.hash || "").slice(1); if (TABS.includes(h0)) S.tab = h0;
  render(true);
  brancherNuage();
})();
</script>
<script>if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js");</script>
